<style type="text/css">
    td {
        padding: 3.2px 0px;
    }
</style>

<div class="dashboard-wrapper">
    <div class="container-fluid dashboard-content">
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                <div class="section-block" id="c-nav">
                </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12 col-lg-6 col-md-6 col-sm-12 col-12">
                <div class="card">

                    <div class="card-header">
                        Dreambot Configuration
                    </div>

                    <div class="card-body">
                        <form method="post">
                            <table style="width:100%">
                                <tr>
                                    <td>Client Location</td>
                                    <td><input type="text" name="jar" value="{{ .Config.DreambotJar }}" class="form-control"></td>
                                </tr>
                                <tr>
                                    <td>Logs Location</td>
                                    <td><input type="text" name="logs" value="{{ .Config.DreambotLogsDir }}" class="form-control"></td>
                                </tr>
                                <tr>
                                    <td>Dreambot Username</td>
                                    <td><input type="text" name="user" value="{{ .Config.DreambotUsername }}" class="form-control"></td>
                                </tr>
                                <tr>
                                    <td>Dreambot Password</td>
                                    <td><input type="password" name="pass" value="{{ .Config.DreambotPassword }}" class="form-control"></td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="submit" name="update" value="Update Configuration" class="form-control btn btn-primary">
                                    </td>
                                    <td></td>
                                </tr>
                            </table>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12 col-lg-6 col-md-6 col-sm-12 col-12">
                <div class="card">

                    <div class="card-header">
                        BotBuddy Configuration
                    </div>

                    <div class="card-body">
                        <form method="post">
                            <table style="width:70%">
                                <tr>
                                    <td>
                                        Banned Account Actions
                                    </td>
                                    <td>
                                        {{ $d := .Config }}
                                        <select name="banned_action" class="form-control">
                                            <option value="0" {{if eq .Config.BannedAction 0 }} selected {{end}}>No Action</option>
                                            <option value="-1" {{if eq .Config.BannedAction -1 }} selected {{end}}>Delete</option>
                                            {{ range .Groups }}
                                                <option value="{{ .Id }}" {{ if eq .Id $d.BannedAction }} selected {{end}}>Move to Group: {{ .Name }}</option>
                                            {{ end }}
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Complete Account Actions</td>
                                    <td>
                                        <select name="complete_action" class="form-control">
                                            <option value="0"{{if eq .Config.CompleteAction 0}} selected{{end}}>No Action</option>
                                            <option value="-1"{{if eq .Config.CompleteAction -1}} selected{{end}}>Stop & remove from schedule</option>
                                            {{ range .Groups }}
                                                <option value="{{.Id}}"{{if eq .Id $d.CompleteAction}} selected{{end}}>Stop and move to: {{.Name}}</option>
                                            {{ end }}
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="submit" name="update_system" value="Update Config" class="form-control btn btn-primary" style="width:160px;">
                                    </td>
                                    <td>

                                    </td>
                                </tr>
                            </table>
                        </form>
                        <hr style="width:75%">
                        <form method="post">
                            <table style="width:100%">
                                <tr>
                                    <td><span style="color:red;font-weight:bold;">Reset Entire Panel</span></td>
                                    <td>
                                        <input type="submit" name="oh_shit_button" value="Yes, I want to delete it all!" class="form-control btn btn-danger">
                                    </td>
                                </tr>
                            </table>
                        </form>
                        <br /><br />
                        Resetting your panel is irreversible. Do this only if you really need to.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
