<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
    <link href="assets/vendor/fonts/circular-std/style.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/libs/css/style.css">
    <link rel="stylesheet" href="assets/vendor/fonts/fontawesome/css/fontawesome-all.css">
    <link rel="stylesheet" href="assets/vendor/vector-map/jqvmap.css">
    <link href="assets/vendor/jvectormap/jquery-jvectormap-2.0.2.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/vendor/daterangepicker/daterangepicker.css" />
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="//cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="//cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
    <title>Botworks by lolwat</title>
</head>

<body>
    <div class="dashboard-main-wrapper">
        <div class="dashboard-header">
            <nav class="navbar navbar-expand-lg bg-white fixed-top">
                <a class="navbar-brand" href="/">Botbuddy</a></nav>
        </div>
        <div class="nav-left-sidebar sidebar-dark">
            <div class="menu-list">
                <nav class="navbar navbar-expand-lg navbar-light">
                    <a class="d-xl-none d-lg-none" href="#">Welcome, name</a>
                    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav flex-column">
                            <li class="nav-divider">
                                Your Manager
                            </li>
                            {{ if .LoggedIn }}

                                <li class="nav-item ">
                                    <a class="nav-link {{ if eq .Url "dashboard" }}active{{ end }}" href="/dashboard" aria-expanded="false"><i class="fa fa-fw fa-window-maximize"></i>Dashboard</a>
                                </li>
                                <li class="nav-item ">
                                    <a class="nav-link {{ if eq .Url "accounts" }}active{{ end }}" href="/accounts" aria-expanded="false"><i class="fa fa-fw fa-address-book"></i>Accounts</a>
                                </li>

                                <li class="nav-item ">
                                    <a class="nav-link {{ if eq .Url "proxies" }}active{{ end }}" href="/proxies" aria-expanded="false"><i class="fa fa-fw fa-rss"></i>Proxies</a>
                                </li>

                                <li class="nav-item ">
                                    <a class="nav-link {{ if eq .Url "groups" }}active{{ end }}" href="/groups" aria-expanded="false"><i class="fa fa-fw fa-user"></i>Groups</a>
                                </li>

                                <li class="nav-item ">
                                    <a class="nav-link {{ if eq .Url "schedules" }}active{{ end }}" href="/schedules" aria-expanded="false"><i class="fa fa-fw fa-clipboard-list"></i>Schedules</a>
                                </li>

                                <li class="nav-item ">
                                    <a class="nav-link" href="/logout" aria-expanded="false"><i class="fa fa-fw fa-window-close"></i>Log out</a>
                                </li>

                            {{ else }}
                                <li class="nav-item ">
                                    <a class="nav-link active" href="/" aria-expanded="false"><i class="fa fa-fw fa-window-maximize"></i>Log in</a>
                                </li>
                            {{ end }}
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</body>
