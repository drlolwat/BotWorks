<div class="splash-container">
    <div class="card ">
        <div class="card-header text-center"><span class="splash-title">Welcome to BotBuddy</span><br />
            <span class="splash-description">
                {{ if .NeedsAccount }}
                    Please set up your BotBuddy by entering the username and password you wish to use. <br /> <br />
                        You cannot reset this password. Do not forget it, or you will need a fresh database.
                {{ else }}
                    Log in to proceed.
                {{ end }}
            </span>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="form-group">
                    <input class="form-control form-control-lg" id="username" type="text" placeholder="Username" autocomplete="off" name="handle" required>
                </div>
                <div class="form-group">
                    <input class="form-control form-control-lg" id="password" type="password" placeholder="Password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
            </form>
        </div>
    </div>
</div>
</div>
